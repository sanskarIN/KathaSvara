name: KathaSvara CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Avoid spending Windows CI time compiling superseded rapid development commits.
concurrency:
  group: kathasvara-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight unit-test dependencies
        working-directory: services/inference
        run: python -m pip install -e ".[test]"
      - name: Ruff
        working-directory: services/inference
        run: python -m ruff check .
      - name: Unit tests (no weights downloaded)
        working-directory: services/inference
        run: python -m pytest -q
      - name: Exercise local JSON bridge
        working-directory: services/inference
        run: echo '{"action":"health"}' | python -m kathasvara.cli
      - name: Confirm no-model dependency diagnostics
        working-directory: services/inference
        run: |
          echo '{"action":"diagnose"}' | python -m kathasvara.cli | python -c "import json,sys; r=json.load(sys.stdin); assert r['ok'] and r['result']['model_weights_verified'] is False and r['result']['audio_synthesis_verified'] is False"

  frontend:
    name: React build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend packages
        run: npm install --no-audit --no-fund
      - name: React unit tests
        run: npm run test
      - name: Typecheck and build
        run: npm run build

  rust-windows:
    name: Windows Rust desktop checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Rust for validation
        run: cargo fmt
      - name: Verify rustfmt output
        run: cargo fmt -- --check
      - name: Native unit tests
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  preview-release:
    name: Publish v0.1.1 source-only pre-release
    # Explicit one-time opt-in; never release on ordinary commits or pull requests.
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: publish v0.1.1 developer pre-release' }}"
    needs: [python, frontend, rust-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refuse duplicate v0.1.1 tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.1" > /dev/null 2>&1; then
            echo "::error::v0.1.1 Git tag already exists; refusing to overwrite it."
            exit 1
          fi
          if gh release view v0.1.1 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::v0.1.1 release already exists."
            exit 1
          fi
      - name: Publish explicitly scoped developer preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "KathaSvara v0.1.1 — Developer Preview (Source Only)" \
            --notes-file docs/releases/v0.1.1-notes.md \
            --prerelease
      - name: Confirm release visibility and pre-release flag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.1" \
            --jq '"Release: " + .html_url + " | prerelease=" + (.prerelease|tostring)'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.1" --jq '.prerelease')" = "true"
