name: KathaSvara CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Avoid spending Windows CI time compiling superseded rapid development commits.
concurrency:
  group: kathasvara-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight unit-test dependencies
        working-directory: services/inference
        run: python -m pip install -e ".[test]"
      - name: Ruff
        working-directory: services/inference
        run: python -m ruff check .
      - name: Unit tests (no weights downloaded)
        working-directory: services/inference
        run: python -m pytest -q
      - name: Exercise local JSON bridge
        working-directory: services/inference
        run: echo '{"action":"health"}' | python -m kathasvara.cli
      - name: Confirm no-model dependency diagnostics
        working-directory: services/inference
        run: |
          echo '{"action":"diagnose"}' | python -m kathasvara.cli | python -c "import json,sys; r=json.load(sys.stdin); assert r['ok'] and r['result']['model_weights_verified'] is False and r['result']['audio_synthesis_verified'] is False"

  frontend:
    name: React build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend packages
        run: npm install --no-audit --no-fund
      - name: React unit tests
        run: npm run test
      - name: Typecheck and build
        run: npm run build

  rust-windows:
    name: Windows Rust desktop checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Rust for validation
        run: cargo fmt
      - name: Verify rustfmt output
        run: cargo fmt -- --check
      - name: Native unit tests
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  windows-v020:
    name: Build unsigned v0.2.0 Windows EXE for release
    # Do not build or upload assets from pull requests or ordinary commits.
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: publish v0.2.0 experimental developer pre-release' }}"
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend packages
        run: npm install --no-audit --no-fund
      - name: Test and build frontend
        run: |
          npm run test
          npm run build
      - name: Compile unsigned Windows executable, not an installer
        run: npm run tauri -- build --no-bundle
      - name: Stage binary, dependency warning and checksum
        shell: pwsh
        working-directory: .
        run: |
          $source = "apps/desktop/src-tauri/target/release/kathasvara.exe"
          if (-not (Test-Path $source)) { throw "Missing compiled Tauri Windows EXE." }
          $directory = "release-assets"
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $name = "KathaSvara-v0.2.0-dev-win64.exe"
          Copy-Item $source "$directory/$name"
          Copy-Item "docs/installation/portable-windows-candidate.md" "$directory/README.txt"
          Get-FileHash "$directory/$name" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $name" } |
            Set-Content "$directory/SHA256SUMS.txt" -Encoding utf8
          if (-not (Test-Path "$directory/README.txt")) { throw "Missing dependency notice." }
      - uses: actions/upload-artifact@v4
        with:
          name: kathasvara-v0.2.0-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

  preview-release:
    name: Publish v0.2.0 experimental developer pre-release
    # Exactly one authorized main-branch commit can publish this release.
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: publish v0.2.0 experimental developer pre-release' }}"
    needs: [python, frontend, rust-windows, windows-v020]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to overwrite existing v0.2.0 tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.2.0" > /dev/null 2>&1; then
            echo "::error::v0.2.0 tag already exists; refusing to overwrite."
            exit 1
          fi
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::v0.2.0 release already exists."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: kathasvara-v0.2.0-release-assets
          path: release-assets
      - name: Verify exact binary hash and required disclosures
        run: |
          cd release-assets
          test -s KathaSvara-v0.2.0-dev-win64.exe
          test -s README.txt
          test -s SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          grep -qi 'NOT A COMPLETE INSTALLER' README.txt
      - name: Publish source archives plus unsigned experimental EXE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0 \
            release-assets/KathaSvara-v0.2.0-dev-win64.exe \
            release-assets/SHA256SUMS.txt \
            release-assets/README.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "KathaSvara v0.2.0 — Experimental Developer Preview" \
            --notes-file docs/releases/v0.2.0-notes.md \
            --prerelease
      - name: Verify tag, prerelease flag, and three assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.2.0" --jq '.prerelease')" = "true"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.2.0" --jq '.draft')" = "false"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.2.0" --jq '.assets | length')" = "3"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.2.0" --jq '.html_url'
