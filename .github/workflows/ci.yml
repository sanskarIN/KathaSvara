name: KathaSvara CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Avoid spending Windows CI time compiling superseded rapid development commits.
concurrency:
  group: kathasvara-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install lightweight unit-test dependencies
        working-directory: services/inference
        run: python -m pip install -e ".[test]"
      - name: Ruff
        working-directory: services/inference
        run: python -m ruff check .
      - name: Unit tests (no weights downloaded)
        working-directory: services/inference
        run: python -m pytest -q
      - name: Exercise local JSON bridge
        working-directory: services/inference
        run: echo '{"action":"health"}' | python -m kathasvara.cli
      - name: Confirm no-model dependency diagnostics
        working-directory: services/inference
        run: |
          echo '{"action":"diagnose"}' | python -m kathasvara.cli | python -c "import json,sys; r=json.load(sys.stdin); assert r['ok'] and r['result']['model_weights_verified'] is False and r['result']['audio_synthesis_verified'] is False"

  journal-windows:
    name: Windows Python journal atomicity (no model)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install minimal test runner
        run: python -m pip install pytest
      - name: Verify exclusive journals and safe progress publication on NTFS
        env:
          PYTHONPATH: ${{ github.workspace }}/services/inference
        run: python -m pytest -q services/inference/tests/test_render_journal_atomicity.py services/inference/tests/test_progress_sidecars.py

  frontend:
    name: React build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend packages
        run: npm ci --no-audit --no-fund
      - name: Audit complete locked npm dependency graph (high+)
        run: npm audit --audit-level=high
      - name: React unit and mocked desktop interaction tests (no real audio)
        run: npm run test
      - name: Typecheck and build
        run: npm run build

  rust-windows:
    name: Windows Rust desktop checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Rust for validation
        run: cargo fmt
      - name: Verify rustfmt output
        run: cargo fmt -- --check
      - name: Native unit tests
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # Release publication moved to guarded, manually dispatched release-v0.2.1.yml.\n