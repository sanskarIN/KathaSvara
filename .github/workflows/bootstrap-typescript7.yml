name: One-time TypeScript 7 upgrade check (development only)
on:
  push:
    branches: [dev/post-v0.5.0-typescript7-rebase]
    paths:
      - ".github/workflows/bootstrap-typescript7.yml"
permissions:
  contents: write
jobs:
  migrate:
    if: github.repository == 'sanskarIN/KathaSvara' && github.ref == 'refs/heads/dev/post-v0.5.0-typescript7-rebase'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/post-v0.5.0-typescript7-rebase
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Upgrade and validate TypeScript against current React 19 and Vite 8 graph
        working-directory: apps/desktop
        run: |
          npm install --save-dev --no-audit --no-fund typescript@^7.0.2
          npm ci --no-audit --no-fund
          npm ls typescript --depth=0
          npm run test
          npm run build
          npm audit --audit-level=high
      - name: Commit only validated manifest and lockfile
        run: |
          set -euo pipefail
          git config user.name "KathaSvara Development"
          git config user.email "sanskarin@outlook.in"
          git add apps/desktop/package.json apps/desktop/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build(deps): update TypeScript 7 after React 19 migration"
          git push origin HEAD:dev/post-v0.5.0-typescript7-rebase
