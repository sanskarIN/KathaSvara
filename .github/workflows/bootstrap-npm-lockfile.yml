name: One-time npm lockfile bootstrap (development branch only)

on:
  push:
    branches:
      - dev/v0.5.0-npm-reproducibility
    paths:
      - .github/workflows/bootstrap-npm-lockfile.yml

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.repository == 'sanskarIN/KathaSvara' && github.ref == 'refs/heads/dev/v0.5.0-npm-reproducibility'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.5.0-npm-reproducibility
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate npm v3 lockfile from the real registry
        working-directory: apps/desktop
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e 'const p=require("./package-lock.json"); if (p.lockfileVersion!==3 || p.packages[""].version!=="0.5.0" || !p.packages["node_modules/vite"]) process.exit(1); console.log("Lockfile entries:", Object.keys(p.packages).length);'
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls vite --depth=0
      - name: Commit generated lockfile only to this development branch
        run: |
          set -euo pipefail
          git config user.name "KathaSvara Development"
          git config user.email "sanskarin@outlook.in"
          git add apps/desktop/package-lock.json
          git diff --cached --exit-code && { echo "Lockfile already committed"; exit 0; }
          git commit -m "build(deps): add npm lockfile generated by Node 22 for reproducible installs"
          git push origin HEAD:dev/v0.5.0-npm-reproducibility
