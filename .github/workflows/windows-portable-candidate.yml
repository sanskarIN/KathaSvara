name: Windows developer executable candidate

# A packaging smoke test, not an installer or public GitHub Release.
on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "services/inference/**"
      - ".github/workflows/windows-portable-candidate.yml"
      - "scripts/windows/launch-with-audio.ps1"
      - "scripts/windows/inspect-desktop-candidate.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-candidate:
    name: Build unsigned Windows EXE candidate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Check launch helpers parse in Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($script in @(
            "scripts/windows/launch-with-audio.ps1",
            "scripts/windows/inspect-desktop-candidate.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path (Get-Location) $script), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "Windows PowerShell 5.1 parser rejected $script."
            }
          }
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund
      - name: Run JS tests and build assets
        working-directory: apps/desktop
        run: |
          npm run test
          npm run build
      - name: Compile desktop EXE without bundling an installer
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle
      - name: Confirm EXE is present
        shell: pwsh
        run: |
          $exe = "apps/desktop/src-tauri/target/release/kathasvara.exe"
          if (-not (Test-Path $exe)) {
            throw "Tauri build did not emit the expected Windows EXE."
          }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          Get-Item $exe | Select-Object Name,Length,LastWriteTime | Format-List
      - name: Package test EXE with dependency disclosure
        shell: pwsh
        env:
          KATHASVARA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $folder = "portable-candidate"
          $filename = "KathaSvara-unreleased-dev-win64.exe"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item "apps/desktop/src-tauri/target/release/kathasvara.exe" "$folder/$filename"
          $prHead = if ($env:KATHASVARA_PR_HEAD_SHA) {
            $env:KATHASVARA_PR_HEAD_SHA
          } else {
            "not applicable (manual workflow)"
          }
          @(
            "KathaSvara UNRELEASED source snapshot - Windows x64 developer candidate"
            "NOT v0.5.6. NOT STABLE. UNSIGNED. NOT A COMPLETE INSTALLER."
            ""
            "Checked-out source SHA: $env:GITHUB_SHA"
            "Pull request head SHA: $prHead"
            "GitHub Actions run ID: $env:GITHUB_RUN_ID"
            ""
            "The executable does not bundle Python 3.11, Chatterbox, faster-whisper,"
            "optional TTS/STT dependencies, any model weights, or a managed installer."
            "No CI job proves real Hindi speech, microphone permission or recognition."
            "Use the SHA256SUMS.txt from THIS SAME workflow artifact to verify the EXE."
            "Read-only Windows/PE/WebView2 preflight source: scripts/windows/inspect-desktop-candidate.ps1"
            "Do not confuse this file with the published v0.5.6 GitHub Release:"
            "https://github.com/sanskarIN/KathaSvara/releases/tag/v0.5.6"
            ""
            "Setup and limitations:"
            "https://github.com/sanskarIN/KathaSvara/blob/main/docs/installation/windows-development-candidate.md"
            "https://github.com/sanskarIN/KathaSvara/blob/main/docs/installation/audio-troubleshooting.md"
            "Human acceptance remains open in issues #3, #129 and #142."
          ) | Set-Content "$folder/README.txt" -Encoding utf8
          Get-FileHash "$folder/$filename" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $filename" } |
            Set-Content "$folder/SHA256SUMS.txt"
      - name: Read-only Windows x64, SHA256 and WebView2 preflight
        shell: pwsh
        run: |
          & ./scripts/windows/inspect-desktop-candidate.ps1 `
            -ExecutablePath "$((Resolve-Path -LiteralPath 'portable-candidate/KathaSvara-unreleased-dev-win64.exe').Path)"
          # PowerShell functions report failures by throwing; a successful
          # script with no native commands does not define LASTEXITCODE.
      - uses: actions/upload-artifact@v7
        with:
          name: kathasvara-unreleased-windows-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: portable-candidate/
          if-no-files-found: error
          retention-days: 14
